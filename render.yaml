# Render Blueprint Specification for FIT3D Web Application
# Because FIT3D is a static React + Vite + Three.js SPA backed by Firebase BaaS
# (no custom Node/Express backend server exists in this repository),
# Render Static Site is the recommended zero-maintenance deployment target.

services:
  - type: web
    name: fit3d-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /models/*.glb
        name: Cache-Control
        value: public, max-age=2592000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
