services:
  - type: web
    name: fit3d-web
    runtime: static
    buildCommand:    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 22
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /models/*.glb
        name: Cache-Control
        value: public, max-age=2592000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
